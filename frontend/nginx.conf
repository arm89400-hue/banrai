server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # Docker's internal DNS: lets nginx start even before the backend is up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:4000;

    # On the server the host nginx sends these straight to the API; this is
    # for running the whole stack with Docker on your own computer.
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $api;
    }

    location = /health {
        proxy_pass $api;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /images/ {
        add_header Cache-Control "no-cache";
    }
}
