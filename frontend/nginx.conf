server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed build assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: let react-router handle any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current build's assets, so browsers must check it
    # on every visit; otherwise a cached copy keeps showing the old site
    # after a rebuild.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Photos keep their names when replaced, so revalidate them too.
    location /images/ {
        add_header Cache-Control "no-cache";
    }
}
