# Your computer only (docker compose reads this file automatically).
# The server never uses it: the deploy runs "docker compose -f docker-compose.yml".
services:
  db:
    # Reach the database from your computer (and run the backend tests against
    # it: TEST_DATABASE_URL defaults to localhost:5433).
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      # Sample rooms and activities on a new local database.
      MIGRATE_SEED: 'true'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: app

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: ''
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
