sonar.projectKey=baanrai-homestay
sonar.projectName=Baanrai Homestay
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,frontend/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/assets/**
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Run `npm run coverage` before scanning.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
# Same as the coverage include/exclude lists in backend/ and frontend/vitest.config.js:
# pages, components and browser-only helpers are checked by hand, not unit tests.
sonar.coverage.exclusions=backend/src/index.js,\
  frontend/src/*.jsx,\
  frontend/src/*.css,\
  frontend/src/pages/**,\
  frontend/src/components/**,\
  frontend/src/context/**,\
  frontend/src/lib/motion.js,\
  frontend/src/lib/reveal.js,\
  frontend/src/lib/glide.js,\
  frontend/src/lib/confirmationImage.js
# The Thai and English text tables have the same shape ('key': 'text'), which the
# duplicate check reads as copy-paste. They are still scanned for everything else.
sonar.cpd.exclusions=frontend/src/i18n/strings.js,frontend/src/i18n/*Strings.js

# "Hard-coded password" (S2068) fires on Thai labels that contain the word
# รหัสผ่าน, e.g. 'reset.password': 'รหัสผ่านใหม่'. Text tables hold no credentials.
sonar.issue.ignore.multicriteria=pwlabels
sonar.issue.ignore.multicriteria.pwlabels.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.pwlabels.resourceKey=frontend/src/i18n/*Strings.js
