services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_y4
    volumes:
      - db-data:/var/lib/postgresql/data
      # Official postgres image auto-runs any .sql dropped here, in name
      # order, but only against a brand-new (empty) data volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      # Host port 5433, not 5432 - avoids clashing with a native Postgres
      # install already listening on 5432. Internal traffic (backend -> db)
      # goes over the compose network regardless, on the container's 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides the localhost value from backend/.env - inside the
      # compose network the database is reachable at the service name.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/test_y4
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser (not the container) calls this URL, so it must be
        # reachable from the host - the backend's published port, not the
        # internal service name.
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
