# Deploy: runs after CI passes on main (or by hand: Actions > Deploy > Run workflow).
#   1. build the three images and push them to GHCR (ghcr.io), tagged
#      "latest" and "sha-xxxxxxx", using the built-in GITHUB_TOKEN
#   2. copy docker-compose.yml and deploy/ scripts to the VPS app folder (no
#      git needed there), then SSH: docker compose pull + up -d with the exact
#      images just built, then check /health
# Step 2 is skipped (not failed) until the VPS settings below exist.
#
# Repository Secrets (Settings > Secrets and variables > Actions > Secrets):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY (private key), VPS_PORT (optional, 22)
# Repository Variables (same page > Variables):
#   VPS_APP_DIR            the app folder on the VPS (e.g. /opt/baanrai)
#   VITE_GOOGLE_CLIENT_ID  public Google client ID baked into the website
#   SITE_URL               optional, e.g. https://book.baanraihomestay.tech
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/banrai-backend:latest
            ${{ env.REGISTRY }}/banrai-backend:${{ steps.tag.outputs.tag }}

      - name: Migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/banrai-migrator:latest
            ${{ env.REGISTRY }}/banrai-migrator:${{ steps.tag.outputs.tag }}

      - name: Website image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_URL=
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/banrai-frontend:latest
            ${{ env.REGISTRY }}/banrai-frontend:${{ steps.tag.outputs.tag }}

  vps:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Is the VPS set up in GitHub?
        id: ready
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$KEY" ] && [ -n "$DIR" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: set secrets VPS_HOST, VPS_USER, VPS_SSH_KEY and variable VPS_APP_DIR. Images are already on GHCR."
          fi

      - name: SSH key and known host
        if: steps.ready.outputs.ok == 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # A key copied on Windows may carry \r line endings; ssh needs plain \n.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Checks that print only non-secret facts about the key.
          first=$(head -n 1 ~/.ssh/deploy_key)
          lines=$(wc -l < ~/.ssh/deploy_key)
          if ! err=$(ssh-keygen -y -P '' -f ~/.ssh/deploy_key 2>&1 >/dev/null); then
            echo "::error::VPS_SSH_KEY is not a usable private key (first line: '$first', $lines lines): $err. Copy the whole file again: Get-Content \$HOME\\.ssh\\baanrai_deploy -Raw | Set-Clipboard"
            exit 1
          fi
          if ! ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || ! [ -s ~/.ssh/known_hosts ]; then
            echo "::error::Cannot reach SSH on VPS_HOST port $PORT from GitHub (check VPS_HOST and the VPS firewall)"
            exit 1
          fi

      - name: Copy the compose file and server scripts to the VPS
        if: steps.ready.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || 22 }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o BatchMode=yes"
          if ! out=$($SSH "$USER@$HOST" "mkdir -p '$APP_DIR/deploy'" 2>&1); then
            fp=$(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2, $3}')
            echo "::error::SSH login failed: $(echo "$out" | tail -n 2 | tr '\n' ' ') (key fingerprint $fp, user length ${#USER})"
            exit 1
          fi
          scp -i ~/.ssh/deploy_key -P "$PORT" -o BatchMode=yes docker-compose.yml "$USER@$HOST:$APP_DIR/"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o BatchMode=yes deploy/make-env.sh deploy/nginx-baanrai.conf "$USER@$HOST:$APP_DIR/deploy/"

      - name: Pull and start the new images on the VPS
        if: steps.ready.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || 22 }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o ServerAliveInterval=30 "$USER@$HOST" \
            "APP_DIR='$APP_DIR' REGISTRY='$REGISTRY' TAG='$TAG' bash -s" <<'REMOTE'
          set -e
          cd "$APP_DIR"
          # First deploy: create .env (reuses the DB password in deploy/.env.prod,
          # or makes a random one). Never overwrites an existing .env.
          [ -f .env ] || sh deploy/make-env.sh
          [ -f backend/.env ] || { echo "backend/.env missing in $APP_DIR"; exit 1; }
          export APP_IMAGE="$REGISTRY/banrai-backend:$TAG"
          export MIGRATOR_IMAGE="$REGISTRY/banrai-migrator:$TAG"
          export WEB_IMAGE="$REGISTRY/banrai-frontend:$TAG"
          # Only the "baanrai" project is touched; other sites keep running.
          for i in 1 2 3; do docker compose -f docker-compose.yml pull && break; echo "pull failed, retrying"; sleep 10; done
          docker compose -f docker-compose.yml up -d
          API_PORT=$(sed -n 's/^API_PORT=//p' .env); API_PORT=${API_PORT:-8345}
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$API_PORT/health"; then echo; echo "healthy: $TAG"; exit 0; fi
            sleep 3
          done
          echo "health check failed"
          docker compose -f docker-compose.yml ps -a
          docker compose -f docker-compose.yml logs --tail 60 migrate backend
          exit 1
          REMOTE

      - name: Check the public site
        if: steps.ready.outputs.ok == 'true' && vars.SITE_URL != ''
        run: curl -fsS --retry 5 --retry-delay 3 "${{ vars.SITE_URL }}/health"
