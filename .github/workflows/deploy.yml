# CI/CD: every push to the deploy branch runs the tests, and only if they all
# pass, logs in to the server over SSH and rebuilds the site with Docker.
#
# Secrets live in GitHub (Settings > Secrets and variables > Actions), never in
# the repository:
#   SSH_HOST         server address
#   SSH_USER         SSH user on the server
#   SSH_PRIVATE_KEY  private key whose public half is in that user's ~/.ssh/authorized_keys
#   SSH_PORT         optional, defaults to 22
#   DEPLOY_PATH      folder of this project on the server (the git clone)
# The app's own settings (backend/.env, deploy/.env.prod) stay on the server only.

name: Test and deploy

on:
  push:
    branches: [site-polish]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that exists only inside this CI run.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/baanrai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend tests
        working-directory: backend
        run: npx vitest run
      - name: Frontend tests
        working-directory: frontend
        run: npx vitest run
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and rebuild on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,BRANCH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            test -f backend/.env && test -f deploy/.env.prod
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
            # Only the "baanrai" compose project is touched; other sites on the
            # server keep running as they are.
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod ps
