# Host nginx for book.baanraihomestay.tech -> the baanrai containers.
# Install (as root on the server):
#   cp deploy/nginx-baanrai.conf /etc/nginx/sites-available/baanrai
#   ln -sf /etc/nginx/sites-available/baanrai /etc/nginx/sites-enabled/baanrai
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d book.baanraihomestay.tech --redirect
# Ports must match APP_PORT / API_PORT in .env (bound to 127.0.0.1 only).
server {
    listen 80;
    listen [::]:80;
    server_name book.baanraihomestay.tech;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8345;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8345;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8345;
    }

    location / {
        proxy_pass http://127.0.0.1:8344;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
