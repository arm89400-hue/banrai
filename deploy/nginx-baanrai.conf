# The server's Nginx in front of the Baanrai containers (reverse proxy).
# Installed as its own file (sites-available/baanrai or conf.d/baanrai.conf),
# so other sites' files are left alone. Listens on its own port until the
# site has a domain name; then set server_name and add HTTPS (certbot).
#   __LISTEN__   the public port, e.g. 8080
#   __WEB__      the website container's local port (WEB_PORT)
#   __API__      the API container's local port (API_PORT)
server {
    listen __LISTEN__;
    listen [::]:__LISTEN__;
    server_name _;

    # Slip pictures and admin photo uploads.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:__API__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:__API__;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__API__;
    }

    location / {
        proxy_pass http://127.0.0.1:__WEB__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
