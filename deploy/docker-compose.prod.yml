name: baanrai

services:
  db:
    image: postgres:16-alpine
    container_name: baanrai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env.prod}
      POSTGRES_DB: baanrai
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    container_name: baanrai-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/baanrai
      UPLOAD_DIR: /app/uploads
    ports:
      - '127.0.0.1:${API_PORT:-8345}:4000'
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ''
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: baanrai-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8344}:80'

volumes:
  db-data:
  uploads:
